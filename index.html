    let opts = '';
    for (const m of state.modules) {
      const isActive = m.id === state.settings.activeModuleId;
      opts += `<option value="${m.id}" ${isActive ? 'selected' : ''}>${m.name}</option>`;
    }
    opts += '<option value="__new__">+ Nieuwe module aanmaken...</option>';
    sel.innerHTML = opts;
    sel.onchange = function() {
      newNameInput.classList.toggle('hidden', this.value !== '__new__');
      if (this.value === '__new__') newNameInput.focus();
    };
    newNameInput.classList.add('hidden');
    newNameInput.value = '';
  }
  document.getElementById('importModal').classList.add('open');
}
function closeImportModal() { document.getElementById('importModal').classList.remove('open'); }

function doImport() {
  const fileInput = document.getElementById('csvFileInput');
  const replace = document.getElementById('csvReplace').checked;
  if (!fileInput.files[0]) { alert('Selecteer eerst een CSV-bestand.'); return; }

  // Determine target module
  const moduleSel = document.getElementById('csvModuleSelect');
  let targetModuleId = moduleSel ? moduleSel.value : null;
  if (targetModuleId === '__new__') {
    const newName = document.getElementById('csvNewModuleName').value.trim();
    if (!newName) { alert('Vul een naam in voor de nieuwe module.'); return; }
    targetModuleId = 'mod_' + Date.now();
    state.modules.push({ id: targetModuleId, name: newName, configId: null });
    setActiveModule(targetModuleId);
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const result = importCSV(e.target.result);
    if (!result || result.students.length === 0) {
      alert('Kon geen studenten vinden in het CSV-bestand. Controleer het formaat.');
      return;
    }
    // Assign moduleId and configId to imported groups
    const targetModule = state.modules.find(m => m.id === targetModuleId);
    const defaultConfigId = targetModule && targetModule.configId ? targetModule.configId : (state.settings.activeConfigId || (state.configs.length > 0 ? state.configs[0].id : null));
    for (const g of result.groups) {
      g.moduleId = targetModuleId;
      if (!g.configId) g.configId = defaultConfigId;
    }

    if (replace) {
      // Only replace data within the target module
      const keepGroups = state.groups.filter(g => g.moduleId !== targetModuleId);
      const keepGroupIds = new Set(keepGroups.map(g => g.id));
      const keepTeams = state.teams.filter(t => keepGroupIds.has(t.groupId));
      const keepStudents = state.students.filter(s => keepGroupIds.has(s.groupId));
      // Clear scores/notes for removed students
      const removedStudentIds = state.students.filter(s => !keepGroupIds.has(s.groupId)).map(s => s.id);
      for (const sid of removedStudentIds) { delete state.scores[sid]; delete state.notes[sid]; }

      state.groups = [...keepGroups, ...result.groups];
      state.teams = [...keepTeams, ...result.teams];
      state.students = [...keepStudents, ...result.students];
    } else {
      const maxId = Math.max(0, ...state.students.map(s => s.id));
      result.students.forEach((s, i) => { s.id = maxId + i + 1; });
      for (const g of result.groups) { if (!state.groups.find(x => x.id === g.id)) state.groups.push(g); }
      for (const t of result.teams) { if (!state.teams.find(x => x.id === t.id)) state.teams.push(t); }
      state.students.push(...result.students);
    }
    assignDefaultSlots();
    if (targetModuleId) setActiveModule(targetModuleId);
    saveState();
    closeImportModal();
    showView('dashboard');
    alert(`${result.students.length} studenten geïmporteerd in module "${targetModule ? targetModule.name : 'onbekend'}".`);
  };
  reader.readAsText(fileInput.files[0]);
}

// ==================== CONFIG CRUD ====================
function createConfig(data) {
  const config = {
    id: 'config_' + Date.now(),
    ...data,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.configs.push(config);
  state.settings.activeConfigId = config.id;
  saveState();
  return config;
}

function updateConfig(configId, updates) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  Object.assign(config, updates, { updatedAt: new Date().toISOString() });
  saveState();
}

function deleteConfig(configId) {
  const linkedGroups = state.groups.filter(g => g.configId === configId);
  if (linkedGroups.length > 0) { alert(`Kan niet verwijderen: configuratie is gekoppeld aan ${linkedGroups.length} groep(en). Ontkoppel deze eerst.`); return false; }
  state.configs = state.configs.filter(c => c.id !== configId);
  if (state.settings.activeConfigId === configId) {
    state.settings.activeConfigId = state.configs[0]?.id || null;
  }
  saveState();
  return true;
}

function duplicateConfig(configId) {
  const original = state.configs.find(c => c.id === configId);
  if (!original) return null;
  const copy = JSON.parse(JSON.stringify(original));
  copy.id = 'config_' + Date.now();
  copy.title += ' (kopie)';
  copy.createdAt = new Date().toISOString();
  copy.updatedAt = new Date().toISOString();
  state.configs.push(copy);
  saveState();
  return copy;
}

function exportConfigJSON(configId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const json = JSON.stringify(config, null, 2);
  downloadFile(json, `${config.title.replace(/\s+/g, '-').toLowerCase()}-config.json`, 'application/json');
}

function importConfigFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const config = JSON.parse(e.target.result);
      if (!config.criteria || !config.levels) { alert('Ongeldig configuratiebestand.'); return; }
      config.id = 'config_' + Date.now();
      config.createdAt = new Date().toISOString();
      config.updatedAt = new Date().toISOString();
      state.configs.push(config);
      state.settings.activeConfigId = config.id;
      saveState();
      alert(`Configuratie "${config.title}" ge\u00efmporteerd.`);
      if (currentView === 'console') renderConsole();
      else if (currentView === 'config') renderConfig();
    } catch(err) { alert('Fout bij lezen bestand: ' + err.message); }
  };
  reader.readAsText(file);
}

let apiKeyCallback = null;
let apiKeyEditProvider = 'anthropic';

function showApiKeyModal(callback, provider) {
  apiKeyCallback = callback || null;
  apiKeyEditProvider = provider || state.settings.aiProvider || 'google';

  const isGemini = apiKeyEditProvider === 'gemini';
  document.getElementById('apiKeyModalTitle').textContent = (isGemini ? 'Gemini' : 'Anthropic') + ' API-key instellen';
  document.getElementById('apiKeyModalDesc').innerHTML = isGemini
    ? 'Vul hier je Google Gemini API-key in. Dit is een code die begint met <code>AIza...</code>. Heb je er nog geen? Ga naar <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>, log in met je Google-account en klik op &ldquo;Create API Key&rdquo;. Kopieer de code en plak hem hieronder. De key blijft alleen op jouw computer opgeslagen. Je kunt ook <strong>Anthropic (Claude)</strong> gebruiken via Console &rarr; AI-model.'
    : 'Vul hier je Anthropic API-key in. Dit is een code die begint met <code>sk-ant-...</code>. Heb je er nog geen? Ga naar <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>, maak een account aan en klik op &ldquo;Create Key&rdquo;. Kopieer de code en plak hem hieronder. De key blijft alleen op jouw computer opgeslagen. Je kunt ook <strong>Google Gemini</strong> (gratis) gebruiken via Console &rarr; AI-model.';
  document.getElementById('apiKeyModalLabel').textContent = 'Plak hier je ' + (isGemini ? 'Gemini' : 'Anthropic') + ' API-key';
  document.getElementById('apiKeyInput').placeholder = isGemini ? 'AIza...' : 'sk-ant-...';
  document.getElementById('apiKeyInput').value = (isGemini ? state.settings.geminiApiKey : state.settings.apiKey) || '';
  document.getElementById('apiKeyModal').classList.add('open');
  document.getElementById('apiKeyInput').focus();
}

function closeApiKeyModal() {
  document.getElementById('apiKeyModal').classList.remove('open');
  apiKeyCallback = null;
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { alert('Vul een API-key in.'); return; }
  if (apiKeyEditProvider === 'gemini') {
    state.settings.geminiApiKey = key;
  } else {
    state.settings.apiKey = key;
  }
  saveState();
  closeApiKeyModal();
  if (apiKeyCallback) apiKeyCallback();
}

function deleteApiKey(provider) {
  provider = provider || 'anthropic';
  const label = provider === 'gemini' ? 'Gemini' : 'Anthropic';
  if (!confirm(`${label} API-key verwijderen?`)) return;
  if (provider === 'gemini') {
    delete state.settings.geminiApiKey;
  } else {
    delete state.settings.apiKey;
  }
  saveState();
  if (currentView === 'console') renderConsole();
}

function setAiProvider(provider) {
  state.settings.aiProvider = provider;
  saveState();
  if (currentView === 'console') renderConsole();
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = () => reject(new Error('Bestand kon niet worden gelezen'));
    reader.readAsDataURL(file);
  });
}

// ==================== AI PROVIDER ABSTRACTION ====================
function getActiveApiKey() {
  const provider = state.settings.aiProvider || 'google';
  return provider === 'gemini' ? state.settings.geminiApiKey : state.settings.apiKey;
}

async function callAnthropic({ messages, system, maxTokens = 4096 }) {
  const apiKey = state.settings.apiKey;
  if (!apiKey) throw new Error('Geen Anthropic API-key ingesteld. Ga naar Instellingen om een key in te stellen.');

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: maxTokens,
      cache_control: { type: 'ephemeral' },
      system,
      messages
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    if (response.status === 401) throw new Error('Ongeldige Anthropic API-key. Controleer je key via Console &gt; AI-model.');
    throw new Error(err.error?.message || `API-fout: ${response.status}`);
  }

  const result = await response.json();
  return result.content?.[0]?.text || '';
}

async function callGemini({ messages, system, maxTokens = 4096 }) {
  const apiKey = state.settings.geminiApiKey;
  if (!apiKey) throw new Error('Geen Gemini API-key ingesteld. Ga naar Instellingen om een key in te stellen.');

  // Convert Anthropic-format messages to Gemini format
  const contents = messages.map(msg => {
    const role = msg.role === 'assistant' ? 'model' : 'user';
    const parts = [];

    if (Array.isArray(msg.content)) {
      for (const block of msg.content) {
        if (block.type === 'text') {
          parts.push({ text: block.text });
        } else if (block.type === 'document' && block.source?.type === 'base64') {
          parts.push({ inlineData: { mimeType: block.source.media_type, data: block.source.data } });
        }
      }
    } else {
      parts.push({ text: msg.content });
    }

    return { role, parts };
  });

  const body = { contents, generationConfig: { maxOutputTokens: maxTokens } };
  if (system) {
    body.system_instruction = { parts: [{ text: system }] };
  }

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    if (response.status === 400 || response.status === 403) throw new Error('Ongeldige Gemini API-key. Controleer je key via Console &gt; AI-model.');
    throw new Error(err.error?.message || `API-fout: ${response.status}`);
  }

  const result = await response.json();
  return result.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function callAI({ messages, system, maxTokens = 4096 }) {
  const provider = state.settings.aiProvider || 'google';
  if (provider === 'gemini') return callGemini({ messages, system, maxTokens });
  return callAnthropic({ messages, system, maxTokens });
}

async function parsePDFWithAI(pdfBase64) {
  const text = await callAI({
    messages: [{
      role: 'user',

        { type: 'text', text: 'Analyseer dit beoordelingsformulier en extraheer de assessment-configuratie als JSON.' }
      ]
    }],
    system: AI_SYSTEM_PROMPT,
    maxTokens: 8192
  });

  // Extract JSON from response (may be in markdown code block)
  const jsonMatch = text.match(/```json\s*([\s\S]*?)```/) || text.match(/```\s*([\s\S]*?)```/) || [null, text];
  if (!jsonMatch[1]) throw new Error('Geen JSON gevonden in AI-response');

  return JSON.parse(jsonMatch[1].trim());
}

function validateConfigData(data) {
  const warnings = [];

  // Title: required, but generate fallback
  if (!data.title || typeof data.title !== 'string') {
    data.title = 'Beoordelingsformulier';
    warnings.push('Titel kon niet worden bepaald — pas deze aan.');
  }

  // Criteria: minimum requirement
  if (!Array.isArray(data.criteria) || data.criteria.length === 0) {
    throw new Error('Geen criteria gevonden in het document. Controleer of het een beoordelingsformulier is.');
  }

  // Normalize criteria
  data.criteria.forEach((c, i) => {
    if (!c.id) c.id = i + 1;
    if (!c.tags) c.tags = [];
    if (!c.name) c.name = 'Criterium ' + c.id;
    if (!c.desc) c.desc = '';
  });

  // Levels: provide defaults if missing
  if (!data.levels || !data.levels.count) {
    data.levels = { count: 2, labels: { '1': 'Voldoende', '2': 'Onderscheidend' }, shortLabels: { '1': 'Vold', '2': 'Onderscheidend' } };
    warnings.push('Scoreniveaus waren niet duidelijk \u2014 standaard 2 niveaus aangemaakt. Pas aan indien nodig.');
  }
  if (!data.levels.labels) data.levels.labels = {};
  if (!data.levels.shortLabels) data.levels.shortLabels = {};

  // Ensure 0-based level keys exist
  for (let i = 0; i < data.levels.count; i++) {
    if (!data.levels.labels[String(i)]) data.levels.labels[String(i)] = 'Niveau ' + i;
    if (!data.levels.shortLabels[String(i)]) data.levels.shortLabels[String(i)] = 'N' + i;
  }

  // Fix 1-based level keys from AI: renumber to 0-based if needed
  if (data.levels.labels['1'] !== undefined && data.levels.labels['0'] === undefined) {
    const newLabels = {}, newShort = {};
    for (const [k, v] of Object.entries(data.levels.labels)) {
      newLabels[String(parseInt(k) - 1)] = v;
    }
    for (const [k, v] of Object.entries(data.levels.shortLabels || {})) {
      newShort[String(parseInt(k) - 1)] = v;
    }
    data.levels.labels = newLabels;
    data.levels.shortLabels = newShort;
    for (const c of data.criteria) {
      if (c.tags) c.tags.forEach(t => { t.level = Math.max(0, t.level - 1); });
    }
  }

  // passThreshold: stored on config root (not in grading)
  if (data.grading?.passThreshold !== undefined) {
    data.passThreshold = data.grading.passThreshold;
  }
  if (data.passThreshold === undefined || data.passThreshold === null) {
    data.passThreshold = 1;
    warnings.push('Zak/slaag-drempel niet gevonden \u2014 standaard op minimaal niveau 1 gezet.');
  }
  // Clean up grading object (no longer used)
  delete data.grading;

  data._warnings = warnings;
  return data;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMarkdown(text) {
  const escaped = escapeHtml(text);
  const lines = escaped.split('\n');
  let html = '';
  let inList = false;
  let inTable = false;
  let tableHeaderDone = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Table rows: lines starting and ending with |
    const isTableRow = line.trim().match(/^\|(.+)\|$/);
    const isSeparator = line.trim().match(/^\|[\s\-:|]+\|$/);
    if (isTableRow) {
      if (inList) { html += '</ul>'; inList = false; }
      if (isSeparator) { tableHeaderDone = true; continue; } // skip --- separator row
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (!inTable) {
        html += '<table>';
        inTable = true;
        tableHeaderDone = false;
        // First row is always header
        html += '<thead><tr>' + cells.map(c => `<th>${applyInline(c)}</th>`).join('') + '</tr></thead><tbody>';
        continue;
      }
      html += '<tr>' + cells.map(c => `<td>${applyInline(c)}</td>`).join('') + '</tr>';
      continue;
    }
    if (inTable) { html += '</tbody></table>'; inTable = false; tableHeaderDone = false; }

    // Headers
    const headerMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if (headerMatch) {
      if (inList) { html += '</ul>'; inList = false; }
      const level = Math.min(headerMatch[1].length + 2, 6); // h3-h6 range inside bubble
      html += `<h${level}>${applyInline(headerMatch[2])}</h${level}>`;
      continue;
    }

    // List items: *, -, or numbered (1.)
    const listMatch = line.match(/^(\s*)[*\-]\s+(.+)$/);
    const numListMatch = !listMatch && line.match(/^(\s*)\d+\.\s+(.+)$/);
    if (listMatch || numListMatch) {
      const match = listMatch || numListMatch;
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${applyInline(match[2])}</li>`;
      continue;
    }

    // Close list if we hit a non-list line
    if (inList && line.trim() === '') { continue; } // skip blank lines inside lists
    if (inList && !listMatch && !numListMatch) { html += '</ul>'; inList = false; }

    // Empty line = paragraph break
    if (line.trim() === '') {
      html += '<br>';
      continue;
    }

    // Regular line
    html += applyInline(line) + '<br>';
  }

  if (inList) html += '</ul>';
  if (inTable) html += '</tbody></table>';
  // Clean up trailing <br>
  html = html.replace(/(<br>)+$/, '');
  return html;
}

function applyInline(text) {
  // Bold: **text**
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic: *text* (but not mid-word asterisks)
  text = text.replace(/(?<!\w)\*(?!\s)(.+?)(?<!\s)\*(?!\w)/g, '<em>$1</em>');
  // Inline code: `text`
  text = text.replace(/`(.+?)`/g, '<code>$1</code>');
  return text;
}

async function regenerateTags(configId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  if (!getActiveApiKey()) {
    const provider = state.settings.aiProvider || 'google';
    showApiKeyModal(() => regenerateTags(configId), provider);
    return;
  }

  const btn = document.querySelector(`button[onclick="regenerateTags('${configId}')"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Tags genereren…'; }

  const criteriaText = config.criteria.map(c => `${c.id}. ${c.name}: ${c.desc}`).join('\n');
  const levelLabels = Object.values(config.levels.labels).join(', ');

  try {
    const text = await callAI({
      messages: [{
        role: 'user',
        content: `Genereer per criterium PRECIES 4 korte observatie-tags (max 4 woorden) per scoreniveau.

Assessment: ${config.title}
Niveaus (${config.levels.count}): ${levelLabels}

Criteria:
${criteriaText}

Antwoord als JSON array van objecten met id en tags:
[{ "id": 1, "tags": [{ "text": "...", "level": 1 }, ...] }, ...]`
      }],
      maxTokens: 4096
    });
    const jsonMatch = text.match(/```json\s*([\s\S]*?)```/) || text.match(/```\s*([\s\S]*?)```/) || [null, text];
    const newTags = JSON.parse(jsonMatch[1].trim());

    // Merge: keep custom tags, replace AI-generated ones
    for (const entry of newTags) {
      const crit = config.criteria.find(c => c.id === entry.id);
      if (crit && entry.tags) {
        const customTags = (crit.tags || []).filter(t => t.custom);
        crit.tags = [...entry.tags.map(t => ({ text: t.text, level: t.level, custom: false })), ...customTags];
      }
    }
    config.updatedAt = new Date().toISOString();
    saveState();
    renderConfigEditor(configId);
    alert('Tags opnieuw gegenereerd!');
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Tags regenereren (AI)'; }
    alert('Fout bij genereren tags: ' + err.message);
  }
}

        <button class="btn-action btn-action-danger" onclick="editorRemoveCriterion('${safeId}', ${c.id})" title="Verwijderen">\u2715</button>
      </div>
      <textarea placeholder="Beschrijving..." onchange="editorUpdateCriterion('${safeId}', ${c.id}, 'desc', this.value)">${c.desc || ''}</textarea>`;

    // Tags per level
    for (let lvl = 0; lvl < config.levels.count; lvl++) {
      const lvlTags = (c.tags || []).filter(t => t.level === lvl);
      html += `<div class="config-tag-editor">
        <span class="tags-level-label">${getLevelLabel(config, lvl, true)}:</span>`;
      lvlTags.forEach((tag, ti) => {
        const tagIdx = c.tags.indexOf(tag);
        html += `<span class="tag-chip level${lvl}">${tag.text}<span class="tag-remove" onclick="editorRemoveTag('${safeId}', ${c.id}, ${tagIdx})">\u2715</span></span>`;
      });
      html += `<span class="tag-chip" style="border:1px dashed var(--border);background:transparent;color:var(--text-muted);font-size:0.72rem;cursor:pointer"
        onclick="editorAddTag('${safeId}', ${c.id}, ${lvl})">+ tag</span>`;
      html += `</div>`;
    }

    html += `</div>`;
  }

  html += `<button class="btn btn-outline" onclick="editorAddCriterion('${configId}')" style="margin-top:0.5rem">+ Criterium toevoegen</button>
    </div>`;

  // Score levels
  html += `<div class="config-section">
    <h2>Scoreniveaus (${config.levels.count})</h2>`;
  for (let lvl = 0; lvl < config.levels.count; lvl++) {
    html += `<div class="config-level-row">
      <span class="level-num">${lvl}</span>
      <input type="text" value="${(config.levels.labels[lvl] || '').replace(/"/g, '&quot;')}" placeholder="Volledig label"
        onchange="editorUpdateLevel('${configId}', ${lvl}, 'labels', this.value)">
      <input type="text" value="${(config.levels.shortLabels[lvl] || '').replace(/"/g, '&quot;')}" placeholder="Kort" style="max-width:100px"
        onchange="editorUpdateLevel('${configId}', ${lvl}, 'shortLabels', this.value)">
    </div>`;
  }
  html += `<div style="display:flex;gap:0.5rem;margin-top:0.5rem">
    <button class="btn btn-outline" onclick="editorAddLevel('${configId}')">+ Niveau</button>
    ${config.levels.count > 2 ? `<button class="btn btn-outline" onclick="editorRemoveLevel('${configId}')">- Niveau</button>` : ''}
  </div></div>`;

  // Pass threshold
  html += `<div class="config-section">
    <h2>Zak/slaag</h2>
    <div class="config-level-row">
      <span style="font-size:0.85rem;color:var(--text-muted)">Minimaal vereist niveau per criterium:</span>
      <input type="number" value="${config.passThreshold ?? 1}" min="0" max="${config.levels.count - 1}" style="width:60px"
        onchange="editorUpdatePassThreshold('${configId}', parseInt(this.value))">
      <span style="font-size:0.85rem;color:var(--text-muted)">(${getLevelLabel(config, config.passThreshold ?? 1)})</span>
    </div>
  </div>`;

  // Regenerate tags button
  html += `<div style="margin-top:1.5rem;padding-top:1rem;border-top:2px solid var(--border)">
    <button class="btn btn-outline" onclick="regenerateTags('${configId}')" ${!getActiveApiKey() ? 'title="Vereist API-key"' : ''}>Tags regenereren (AI)</button>
    <span style="font-size:0.8rem;color:var(--text-muted);margin-left:0.5rem">Genereert nieuwe observatie-tags op basis van de criteria. Custom tags blijven behouden.</span>
  </div>`;

  html += `</div>`; // close config-editor

  el.innerHTML = html;
}

// ---- Config editor helper functions ----
function editorUpdateCriterion(configId, critId, field, value) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const crit = config.criteria.find(c => c.id === critId);
  if (crit) { crit[field] = value; config.updatedAt = new Date().toISOString(); saveState(); }
}

function editorAddCriterion(configId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const maxId = config.criteria.length > 0 ? Math.max(...config.criteria.map(c => c.id)) : 0;
  config.criteria.push({ id: maxId + 1, name: 'Nieuw criterium', desc: '', tags: [] });
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorRemoveCriterion(configId, critId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  if (config.criteria.length <= 1) { alert('Een configuratie moet minimaal 1 criterium hebben.'); return; }
  if (!confirm('Criterium verwijderen?')) return;
  config.criteria = config.criteria.filter(c => c.id !== critId);
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorMoveCriterion(configId, index, direction) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const newIdx = index + direction;
  if (newIdx < 0 || newIdx >= config.criteria.length) return;
  [config.criteria[index], config.criteria[newIdx]] = [config.criteria[newIdx], config.criteria[index]];
  // Re-number IDs
  config.criteria.forEach((c, i) => { c.id = i + 1; });
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorAddTag(configId, critId, level) {
  const text = prompt('Observatie-tag tekst:');
  if (!text || !text.trim()) return;
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const crit = config.criteria.find(c => c.id === critId);
  if (!crit) return;
  if (!crit.tags) crit.tags = [];
  crit.tags.push({ text: text.trim(), level, custom: true });
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorRemoveTag(configId, critId, tagIndex) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const crit = config.criteria.find(c => c.id === critId);
  if (!crit || !crit.tags) return;
  crit.tags.splice(tagIndex, 1);
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorUpdateLevel(configId, level, field, value) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  config.levels[field][level] = value;
  config.updatedAt = new Date().toISOString();
  saveState();
}

function editorAddLevel(configId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  const newLvl = config.levels.count; // 0-based: new level = current count
  config.levels.count++;
  config.levels.labels[newLvl] = 'Niveau ' + newLvl;
  config.levels.shortLabels[newLvl] = 'N' + newLvl;
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorRemoveLevel(configId) {
  const config = state.configs.find(c => c.id === configId);
  if (!config || config.levels.count <= 2) return;
  const removeLvl = config.levels.count - 1; // 0-based: highest level = count - 1
  delete config.levels.labels[removeLvl];
  delete config.levels.shortLabels[removeLvl];
  for (const crit of config.criteria) {
    if (crit.tags) crit.tags = crit.tags.filter(t => t.level !== removeLvl);
  }
  config.levels.count--;
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

function editorUpdatePassThreshold(configId, value) {
  const config = state.configs.find(c => c.id === configId);
  if (!config) return;
  config.passThreshold = value;
  config.updatedAt = new Date().toISOString();
  saveState();
  renderConfigEditor(configId);
}

  let html = `<h1>Console &mdash; AI-model</h1>

  <div class="settings-section card">
    <h2>AI-provider</h2>
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem">
      <button class="btn ${provider === 'anthropic' ? 'btn-primary' : 'btn-outline'}" onclick="setAiProvider('anthropic')">Anthropic (Claude)</button>

         <button class="btn btn-outline" onclick="deleteApiKey('anthropic')">Verwijderen</button>`
      : `<p style="color:var(--text-muted);margin-bottom:0.75rem">Je hebt nog geen Anthropic key ingesteld. Zonder key kun je geen PDF's laten analyseren met deze dienst.</p>
         <button class="btn btn-primary" onclick="showApiKeyModal(function(){ renderSettings(); }, 'anthropic')">Anthropic key instellen</button>`
    }

    <h3 style="margin-top:1.25rem">Gemini API-key ${provider === 'gemini' ? '<span style="color:var(--primary);font-size:0.8rem;font-weight:normal">(actief)</span>' : ''}</h3>
    ${hasGeminiKey
      ? `<p style="font-family:monospace;font-size:0.85rem;color:var(--text-muted);margin-bottom:0.75rem">${maskKey(state.settings.geminiApiKey)}</p>
         <button class="btn btn-outline" onclick="showApiKeyModal(function(){ renderSettings(); }, 'gemini')" style="margin-right:0.5rem">Wijzigen</button>
         <button class="btn btn-outline" onclick="deleteApiKey('gemini')">Verwijderen</button>`
      : `<p style="color:var(--text-muted);margin-bottom:0.75rem">Je hebt nog geen Gemini key ingesteld. Zonder key kun je geen PDF's laten analyseren met deze dienst.</p>
         <button class="btn btn-primary" onclick="showApiKeyModal(function(){ renderSettings(); }, 'gemini')">Gemini key instellen</button>`
    }
    <p style="font-size:0.8rem;color:var(--text-muted);margin-top:0.75rem">Je keys worden alleen op jouw computer opgeslagen (in je browser). Ze worden nooit naar ons of naar anderen gestuurd.</p>
  </div>

  <div class="settings-section card">
    <h2>Configuraties (${state.configs.length})</h2>`;

  if (state.configs.length === 0) {
    html += `<p style="color:var(--text-muted)">Geen configuraties. Ga naar <a href="#" onclick="event.preventDefault(); consoleSubTab='formulier'; showView('console')">Console &rarr; Formulier</a> om er een aan te maken.</p>`;
  } else {
    for (const c of state.configs) {
      const linkedGroups = state.groups.filter(g => g.configId === c.id);
      const isActive = state.settings.activeConfigId === c.id;
      html += `<div class="config-list-item" ${isActive ? 'style="border-color:var(--primary)"' : ''}>
        <div class="cli-info">
          <div class="cli-title">${isActive ? '\u25CF ' : '\u25CB '}${c.title}</div>
          <div class="cli-meta">${c.criteria.length} criteria, ${c.levels.count} niveaus${linkedGroups.length > 0 ? ` \u2022 ${linkedGroups.map(g => g.name).join(', ')}` : ''}</div>
        </div>
        <div class="cli-actions">
          <button class="btn-action" onclick="editingConfigId='${c.id}'; showView('config')" title="Bewerken">\u270E</button>
          <button class="btn-action" onclick="exportConfigJSON('${c.id}')" title="Exporteren">&#8681;</button>
          <button class="btn-action btn-action-danger" onclick="if(deleteConfig('${c.id}')) renderSettings()" title="Verwijderen">\u2715</button>
        </div>
      </div>`;
    }
  }

  html += `</div>`;
  el.innerHTML = html;
}

// ==================== TEST SUITE ====================
function runTests() {
  const results = [];
  const assert = (name, condition) => { results.push({ name, pass: !!condition }); if (!condition) console.error('FAIL:', name); };

  // -- Config engine tests (0-based levels, no grading) --
  const testConfig = {
    id: 'test', title: 'Test',
    criteria: [{ id: 1, name: 'A', desc: '', tags: [] }, { id: 2, name: 'B', desc: '', tags: [] }, { id: 3, name: 'C', desc: '', tags: [] }],
    levels: { count: 3, labels: { '0': 'Onvoldoende', '1': 'Voldoende', '2': 'Goed' }, shortLabels: { '0': 'Onv', '1': 'Vold', '2': 'Goed' } },
    passThreshold: 1
  };
  assert('C6: getLevelLabel full', getLevelLabel(testConfig, 1, false) === 'Voldoende');
  assert('C7: getLevelLabel short', getLevelLabel(testConfig, 1, true) === 'Vold');
  assert('C8: getLevelLabel unknown', getLevelLabel(testConfig, 99) === '99');
  assert('C8b: getLevelLabel 0-based', getLevelLabel(testConfig, 0) === 'Onvoldoende');

  // -- studentTotal tests (0-based, no grade) --
  const savedState = JSON.parse(JSON.stringify(state));
  state.scores = { 999: { 1: 2, 2: 1, 3: 2 } };
  const t1 = studentTotal(999, testConfig);
  assert('C9: studentTotal complete', t1.complete === true && t1.total === 5 && t1.hasUnder === false);
  assert('C9b: maxPoints 0-based', t1.maxPoints === 6); // 3 criteria * (3-1) = 6
  state.scores = { 999: { 1: 2 } };
  const t2 = studentTotal(999, testConfig);
  assert('C10: studentTotal incomplete', t2.complete === false && t2.count === 1);
  state.scores = { 999: { 1: 0, 2: 1, 3: 1 } };
  const t3 = studentTotal(999, testConfig);
  assert('C11: studentTotal hasUnder', t3.hasUnder === true); // score 0 < passThreshold 1
  assert('C12: studentTotal null config', studentTotal(999, null).total === 0);
  state = JSON.parse(JSON.stringify(savedState));

  // -- validateConfigData tests --
  try { validateConfigData({ criteria: [{ id: 1 }], levels: { count: 2 } }); assert('C14: validate no title', false); }
  catch(e) { assert('C14: validate no title throws', e.message.includes('Titel')); }
  try { validateConfigData({ title: 'X', criteria: [], levels: { count: 2 } }); assert('C15: validate empty criteria', false); }
  catch(e) { assert('C15: validate empty criteria throws', e.message.includes('criteria')); }

  // -- Score toggle tests --
  const savedState2 = JSON.parse(JSON.stringify(state));
  state.scores = {};
  setScore(1, 1, 3);
  assert('S1: setScore toggle on', getScore(1, 1) === 3);
  setScore(1, 1, 3);
  assert('S2: setScore toggle off', getScore(1, 1) === null);
  setScore(1, 1, 3);
  setScore(1, 1, 2);
  assert('S3: setScore switch level', getScore(1, 1) === 2);
  state = JSON.parse(JSON.stringify(savedState2));

  // -- Tag tests --
  const savedState3 = JSON.parse(JSON.stringify(state));
  state.notes = {};
  insertTagInNote(1, 1, 'helder uitgelegd');
  assert('T1: insertTag on empty', getNote(1, 1) === '\u2713 helder uitgelegd');
  setNote(1, 2, 'goed gesprek');
  insertTagInNote(1, 2, 'actief luisteren');
  assert('T2: insertTag with text', getNote(1, 2).includes('goed gesprek') && getNote(1, 2).includes('\u2713 actief luisteren'));
  insertTagInNote(1, 1, 'helder uitgelegd');
  assert('T3: insertTag toggle off', !getNote(1, 1).includes('\u2713 helder uitgelegd'));
  assert('T4: isTagInNote false', !isTagInNote(1, 1, 'helder uitgelegd'));
  state = JSON.parse(JSON.stringify(savedState3));

  // -- Config CRUD tests --
  const savedState4 = JSON.parse(JSON.stringify(state));
  const newCfg = createConfig({ title: 'Test CRUD', criteria: [{ id: 1, name: 'X', desc: '', tags: [] }], levels: { count: 2, labels: { '0': 'A', '1': 'B' }, shortLabels: { '0': 'A', '1': 'B' } }, passThreshold: 1 });
  assert('CR1: createConfig', state.configs.find(c => c.id === newCfg.id) !== undefined);
  assert('CR2: createConfig becomes active', state.settings.activeConfigId === newCfg.id);
  const dup = duplicateConfig(newCfg.id);
  assert('CR6: duplicateConfig', dup && dup.title.includes('(kopie)') && dup.id !== newCfg.id);
  const delOk = deleteConfig(dup.id);
  assert('CR4: deleteConfig unlinked', delOk === true && !state.configs.find(c => c.id === dup.id));
  state = JSON.parse(JSON.stringify(savedState4));

  // -- CSV parse tests --
  const csvNL = parseCSV('Naam;Groep;Team\nAnna;G01;1');
  assert('V1: parseCSV semicolon', csvNL.length === 2 && csvNL[1][0] === 'Anna');
  const csvEN = parseCSV('Naam,Groep,Team\nAnna,G01,1');
  assert('V2: parseCSV comma', csvEN.length === 2 && csvEN[1][0] === 'Anna');

  // -- Summary --
  const passed = results.filter(r => r.pass).length;
  const failed = results.filter(r => !r.pass);
  console.log(`%cTests: ${passed}/${results.length} passed`, passed === results.length ? 'color:green;font-weight:bold' : 'color:red;font-weight:bold');
  if (failed.length > 0) { console.table(failed.map(r => ({ test: r.name }))); }
  return results;
}
